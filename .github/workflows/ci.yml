name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: mbstring, intl, pdo_sqlite, simplexml, coverage: none }
      - uses: ramsey/composer-install@v3
        with: { working-directory: backend }
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan test
        env: { DB_CONNECTION: sqlite, DB_DATABASE: database/database.sqlite, CACHE_STORE: array, QUEUE_CONNECTION: sync }
      - run: ./vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.2', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
