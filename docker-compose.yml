x-backend-env: &backend-env
  APP_URL: ${APP_URL:-http://localhost}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  SHORT_URL_DOMAIN: ${SHORT_URL_DOMAIN:-http://localhost}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-url_shortener}
  DB_USERNAME: ${MYSQL_USER:-url_shortener}
  DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
  DB_COLLATION: utf8mb4_bin
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  TRUSTED_PROXIES: "*"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-url_shortener}
      MYSQL_USER: ${MYSQL_USER:-url_shortener}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  backend:
    build: ./backend
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    env_file: ./backend/.env
    environment: *backend-env
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue:
    build: ./backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,analytics", "--sleep=1", "--tries=3", "--timeout=60"]
    env_file: ./backend/.env
    environment: *backend-env
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    init: true
    restart: unless-stopped
    stop_grace_period: 75s

  scheduler:
    build: ./backend
    command: ["php", "artisan", "schedule:work"]
    env_file: ./backend/.env
    environment: *backend-env
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    init: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NUXT_API_BASE: http://nginx/api/v1
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost/api/v1}
      NUXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost}
      NUXT_PUBLIC_SHORT_URL_DOMAIN: ${SHORT_URL_DOMAIN:-http://localhost}
    depends_on: { backend: { condition: service_healthy } }
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: { backend: { condition: service_healthy }, frontend: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"], interval: 10s, timeout: 5s, retries: 10 }

volumes:
  mysql-data:
  redis-data:
